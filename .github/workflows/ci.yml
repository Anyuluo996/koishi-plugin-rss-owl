# CI 质量门禁
# 目标：PR / push 到 main 时自动跑类型检查 + 单元测试，保持主干绿灯。
# 不发版、不部署。测试已脱离外部网络依赖（集成测试已解耦），CI 稳定。

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支的并发 push 取消旧任务，节省 CI 资源
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint & Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 18 已 EOL，且代码依赖 Node 20+ 全局 (File API)。
        # 覆盖当前活跃 LTS (20/22)。
        node: ['20', '22']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # 不指定 version，由 package.json 的 packageManager 字段决定（单一来源）

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check (tsc --noEmit)
        run: pnpm run typecheck

      - name: Lint (eslint)
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm test
        env:
          CI: 'true'
